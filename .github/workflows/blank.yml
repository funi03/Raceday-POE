name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check PDF document
        run: |
          test -d docs
          test -f docs/poe.pdf

      - name: Validation successful
        run: echo "RaceDay project documentation is present."
